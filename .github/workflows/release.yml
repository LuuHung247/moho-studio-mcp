name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: bridge/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg lua5.4
      - run: npm ci
        working-directory: bridge
      - run: npm run build && npm run typecheck && npm test
        working-directory: bridge
      - run: lua5.4 moho-plugin/tests/run_tests.lua
      - name: Check tag matches package version
        working-directory: bridge
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Pack
        working-directory: bridge
        run: |
          npm pack --silent
          mv moho-studio-mcp-*.tgz ../moho-studio-mcp.tgz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" moho-studio-mcp.tgz \
            --title "Moho Studio MCP $GITHUB_REF_NAME" --generate-notes
